# This workflow publishes the package to npm using npm Trusted Publishing (OIDC),
# so no long-lived NPM_TOKEN secret is required.
# For more information see: https://docs.npmjs.com/trusted-publishers

name: Node.js Package

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        registry-url: https://registry.npmjs.org/
    # Trusted Publishing requires npm CLI >= 11.5.1
    - run: npm install -g npm@latest
    - run: npm ci
    - run: npm publish
